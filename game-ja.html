        <h1>パックマン オンラインゲーム</h1>
        <p>ブラウザで1980年のクラシックアーケードゲームの完全なゲームプレイを体験してください。本物のサウンドと迷路のリズムが楽しめます。</p>
        <p>キーボードの矢印キーまたはタッチスクリーンでスワイプしてパックマンを操作し、すべてのドットを食べてお化けを避けましょう。</p>
        <p><kbd>Esc</kbd>キーを押すとメニューが開き、モードを切り替えたりホームページに戻って他のゲームを選択できます。</p>

    <script>
    // 修复移动端按钮点击问题：阻止触摸事件被游戏拦截
    (function() {
        var homeButton = document.getElementById('home-button');
        if (homeButton) {
            homeButton.addEventListener('touchstart', function(e) {
                e.stopPropagation();
            }, {passive: false});

            homeButton.addEventListener('touchend', function(e) {
                e.stopPropagation();
                // 确保点击跳转
                window.location.href = homeButton.href;
            }, {passive: false});
        }
    })();
    </script>
